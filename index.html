<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kacpur³ — Cube Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* default direction = Neon Grid; overridden by JS */
    --bg:      #07060d;
    --bg-2:    #0d0b18;
    --panel:   #110e1f;
    --ink:     #f4f1ff;
    --muted:   #9b95b8;
    --neon:    #ff2d9b;
    --neon-2:  #1ef0ff;
    --neon-3:  #ffd84d;
    --grid:    rgba(120,100,200,0.14);
    --stroke:  rgba(255,255,255,0.09);
    --glow:    1;           /* intensity multiplier 0..1.4 */
    --scan:    0.05;        /* scanline opacity */
    --radius:  14px;
    --maxw:    1240px;
    --gutter:  clamp(20px, 5vw, 64px);
    --font-display: "Chakra Petch", system-ui, sans-serif;
    --font-body:    "Space Grotesk", system-ui, sans-serif;
    --font-mono:    "Space Mono", ui-monospace, monospace;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    line-height: 1.5;
  }
  ::selection { background: var(--neon); color: #07060d; }
  /* scrollbar */
  html { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--neon) 50%, #2a2540) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--neon) 50%, #2a2540); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--neon); background-clip: content-box; }

  /* ---------- shared keyframes ---------- */
  @keyframes gridslide { from { background-position: 0 0; } to { background-position: 0 -64px; } }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @keyframes glowpulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 80%, 100% { opacity: 1; }
    20%, 22%, 82% { opacity: .55; }
  }
  @keyframes spinslow { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glitch-a {
    0%,100% { clip-path: inset(0 0 0 0); transform: translate(0); }
    20% { clip-path: inset(20% 0 30% 0); transform: translate(-2px, 1px); }
    40% { clip-path: inset(60% 0 8% 0);  transform: translate(2px, -1px); }
    60% { clip-path: inset(35% 0 45% 0); transform: translate(-1px, 0); }
    80% { clip-path: inset(8% 0 70% 0);  transform: translate(1px, 1px); }
  }
  @keyframes glitch-b {
    0%,100% { clip-path: inset(0 0 0 0); transform: translate(0); }
    25% { clip-path: inset(45% 0 30% 0); transform: translate(2px, -1px); }
    50% { clip-path: inset(10% 0 60% 0); transform: translate(-2px, 1px); }
    75% { clip-path: inset(70% 0 5% 0);  transform: translate(1px, 0); }
  }
  @keyframes scanmove { from { background-position: 0 0; } to { background-position: 0 6px; } }

  .reveal { opacity: 0; }
  .reveal.in { animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    html { scroll-behavior: auto; }
  }

  #root { position: relative; z-index: 1; }
  .nojs { display:none; }
</style>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="image-slot.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="hero.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
